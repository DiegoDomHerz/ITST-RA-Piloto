<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ITST | Prototipo WebAR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR Image Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

  <div id="estado">
    Apunta la cámara hacia IMG-001
  </div>

  <a-scene mindar-image="imageTargetSrc: ./targets/TARGET-003.mind;
                  autoStart: true;
                  uiLoading: yes;
                  uiScanning: yes;
                  uiError: yes;" color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

    <!-- Cámara -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- TARGET-001 -->
    <a-entity id="target-001" mindar-image-target="targetIndex: 0">

      <a-entity id="modelo-003" gltf-model="url(./models/MODELO-003-Deadpool.glb)" position="0 0 0.1" rotation="0 0 0"
        scale="1.5 1.5 1.5">
      </a-entity>

    </a-entity>

  </a-scene>

  <script type="module" src="/src/main.js"></script>

</body>

</html>
